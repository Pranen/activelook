<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello – text &amp; positioning</title>
</head>
<body>
  <a class="back" href="./index.html">← All demos</a>
  <h1>Hello – text &amp; positioning</h1>
  <button id="connect" class="primary">Connect glasses</button>
  <div class="row"><input id="text" value="Hello ENGO" aria-label="Text"></div>
  <div class="row">
    <label>Rotation <select id="rot"><option>0</option><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option></select></label>
    <label>Font <select id="font"><option value="0">0 (24px)</option><option value="1" selected>1 (24px)</option><option value="2">2 (35px)</option><option value="3">3 (49px)</option></select></label>
    <label>X <input id="x" type="number" value="20"></label>
    <label>Y <input id="y" type="number" value="60"></label>
  </div>
  <div class="row">
    <button id="send">Show text</button>
    <button id="grid">Test grid (visible area)</button>
    <button id="clear">Clear</button>
  </div>
  <p class="hint">Logical coordinates, origin top-left. Visible area on ENGO 3: about x 3–270, y 30–255 (see the calibrate demo).</p>
  <div id="log">Ready.</div>
  <script type="module" src="./hello.ts"></script>
</body>
</html>
